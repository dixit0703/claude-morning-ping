# Starts the 5-hour Claude usage window every morning.
# Goes in the repo at: .github/workflows/morning-ping.yml
#
# GitHub schedules use UTC. 03:20 UTC = 08:50 IST.
# GitHub often starts scheduled jobs a few minutes late,
# so this usually lands between about 08:50 and 09:05 IST.

name: Morning Claude ping

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab to test

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Send one message
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        # Haiku keeps the ping as light as possible on your usage.
        run: |
          claude -p "Reply with just: ok" --model haiku --max-turns 1
